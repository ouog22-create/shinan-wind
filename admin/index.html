<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 | 신안어의</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../">신안어의<span>사이트 관리</span></a><a href="../">사이트 보기</a></div></header><main class="wrap section admin-wrap"><p id="admin-status" role="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p><section id="login-section" class="login-panel"><h1>관리자 로그인</h1><form id="login-form"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required><div class="form-actions"><button>로그인</button></div></form><p class="note">비밀번호 분실 시 관리팀에 문의해 주세요.</p></section><section id="dashboard" hidden><div class="admin-bar"><h1>사이트 관리</h1><button id="logout">로그아웃</button></div><div class="tabs" role="group" aria-label="관리 메뉴">
<button type="button" data-collection="news" aria-controls="news-panel" aria-pressed="true">주민상생 뉴스 관리</button>
<button type="button" data-collection="certificates" aria-controls="news-panel" aria-pressed="false">인증서 관리</button>
<button type="button" data-collection="progress" aria-controls="news-panel" aria-pressed="false">사업 추진 현황 관리</button>
<button type="button" aria-controls="admins-panel" aria-pressed="false">관리자 관리</button>
</div><div id="news-panel" class="editor-grid"><section><div class="section-heading"><h2 id="list-title">주민상생 뉴스</h2><button id="new-record">새로 작성</button></div><div id="records"></div></section><section class="form-panel"><h2 id="editor-title">새 항목</h2><form id="editor-form"></form></section></div><section id="admins-panel" hidden>
<h2>관리자 관리</h2><dl><dt>관리자 이메일</dt><dd id="admin-email"></dd></dl>
</section></section></main><script type="module" src="../assets/js/admin.js"></script></body></html>
